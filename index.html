<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورشة إدارة الـ Pipeline والوقت | لعبة تفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161d; --panel:#1b212b; --panel2:#222939; --panel3:#2a3242;
  --gold:#E8A93D; --gold-deep:#C9862A; --red:#E4572E; --green:#3FA796;
  --blue:#3E7CB1; --purple:#B57EDC; --text:#F5F1E8; --dim:#9AA3B2; --border:#2A3241;
  --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow-x:hidden; max-width:100vw;}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(232,169,61,.08), transparent),
    radial-gradient(900px 500px at -5% 110%, rgba(62,124,177,.10), transparent),
    var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Cairo', sans-serif; font-weight:800;}
button{font-family:inherit; cursor:pointer; border:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--panel3); border-radius:10px;}

/* ---------- layout shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, rgba(27,33,43,.97), rgba(27,33,43,.88));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:10px 18px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand .mark{
  width:38px; height:38px; border-radius:10px;
  background:linear-gradient(145deg, var(--gold), var(--gold-deep));
  display:flex; align-items:center; justify-content:center; font-size:19px;
  box-shadow:0 4px 14px rgba(232,169,61,.35);
}
.brand .txt h1{font-size:15px; line-height:1.3;}
.brand .txt span{font-size:11px; color:var(--dim); font-weight:500;}
.score-strip{display:flex; gap:8px; flex-wrap:wrap; flex:1; align-items:center;}
.chip{
  display:flex; align-items:center; gap:7px;
  background:var(--panel2); border:1px solid var(--border);
  border-radius:999px; padding:5px 12px 5px 6px; position:relative;
  transition:transform .25s;
}
.chip.lead{border-color:var(--gold);}
.chip .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.chip b{font-size:13px;}
.chip .pts{font-family:'Cairo'; font-weight:800; font-size:14px; color:var(--gold);}
.chip .medal{font-size:12px; margin-left:2px;}
.chip .plus{
  background:var(--panel3); color:var(--text); width:20px; height:20px; border-radius:50%;
  font-size:13px; display:flex; align-items:center; justify-content:center;
}
.chip .plus:hover{background:var(--gold); color:#1b1400;}
.floatpt{
  position:absolute; top:-6px; right:8px; color:var(--gold); font-family:'Cairo'; font-weight:800;
  font-size:13px; animation:floatUp .9s ease-out forwards; pointer-events:none;
}
@keyframes floatUp{0%{opacity:0; transform:translateY(0)}20%{opacity:1}100%{opacity:0; transform:translateY(-22px)}}
.top-actions{display:flex; gap:8px; flex-shrink:0;}
.iconbtn{
  background:var(--panel2); border:1px solid var(--border); color:var(--text);
  width:36px; height:36px; border-radius:10px; font-size:15px;
  display:flex; align-items:center; justify-content:center;
}
.iconbtn:hover{border-color:var(--gold); color:var(--gold);}

.body-wrap{display:flex; flex:1; min-height:0;}
.sidebar{
  width:260px; flex-shrink:0; background:var(--panel);
  border-left:1px solid var(--border); padding:16px 12px; overflow-y:auto;
}
.sidebar h4{font-size:11px; color:var(--dim); font-weight:700; margin:14px 6px 8px; letter-spacing:.5px;}
.navitem{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:10px;
  font-size:13px; color:var(--dim); margin-bottom:3px; transition:.15s;
}
.navitem .n{
  width:22px; height:22px; border-radius:50%; background:var(--panel2); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700;
}
.navitem:hover{background:var(--panel2); color:var(--text);}
.navitem.active{background:linear-gradient(90deg, rgba(232,169,61,.18), transparent); color:var(--text); font-weight:700;}
.navitem.active .n{background:var(--gold); color:#1b1400;}
.navitem.done .n{background:var(--green); color:#04231d;}
.navitem.done .n::after{content:'✓';}

.main{flex:1; padding:26px 30px 60px; overflow-y:auto; min-width:0;}
.wrap{max-width:880px; margin:0 auto;}

/* ---------- setup screen ---------- */
.setup{max-width:640px; margin:6vh auto; text-align:center;}
.setup .hero-icon{font-size:52px; margin-bottom:10px;}
.setup h1{font-size:30px; margin-bottom:8px;}
.setup p.sub{color:var(--dim); margin-bottom:32px; font-size:14.5px; line-height:1.8;}
.stepper-row{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:22px;}
.stepper-row button{
  width:40px; height:40px; border-radius:50%; background:var(--panel2); border:1px solid var(--border);
  color:var(--gold); font-size:18px; font-weight:800;
}
.stepper-row .count{font-family:'Cairo'; font-size:26px; font-weight:800;}
.team-inputs{display:grid; gap:10px; margin-bottom:28px;}
.team-inputs input{
  background:var(--panel2); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:10px; font-size:14px; text-align:center;
  border-right:4px solid var(--tc, var(--gold));
}
.team-inputs input:focus{outline:none; border-color:var(--gold);}
.btn-primary{
  background:linear-gradient(135deg, var(--gold), var(--gold-deep)); color:#1b1400;
  padding:14px 34px; border-radius:12px; font-weight:800; font-family:'Cairo'; font-size:15.5px;
  box-shadow:0 8px 22px rgba(232,169,61,.28);
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{
  background:transparent; border:1px solid var(--border); color:var(--text);
  padding:11px 22px; border-radius:12px; font-weight:700; font-size:13.5px;
}
.btn-ghost:hover{border-color:var(--gold); color:var(--gold);}

/* ---------- activity content ---------- */
.part-tag{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
  color:var(--gold); background:rgba(232,169,61,.12); padding:5px 12px; border-radius:999px; margin-bottom:14px;
}
.activity-head{margin-bottom:22px;}
.activity-head .ic{font-size:34px;}
.activity-head h2{font-size:25px; margin:8px 0 6px;}
.activity-head .tagline{color:var(--dim); font-size:14px; line-height:1.8;}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 22px; margin-bottom:16px;
}
.card h3{font-size:14.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.instr{
  background:var(--panel2); border-right:3px solid var(--blue); border-radius:10px;
  padding:13px 16px; font-size:13.5px; color:var(--text); line-height:1.9; margin-top:10px;
  display:none;
}
.instr.show{display:block;}
.instr b{color:var(--blue);}
.instr-toggle{
  display:inline-flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--blue);
  color:var(--blue); padding:9px 18px; border-radius:10px; font-weight:700; font-size:13px; margin-bottom:6px;
}
.instr-toggle:hover{filter:brightness(1.15);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:720px){.grid2{grid-template-columns:1fr;}}

/* budget allocator */
.budget-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.budget-remain{font-family:'Cairo'; font-size:15px;}
.budget-remain b{font-size:22px; color:var(--gold);}
.budget-bar{height:10px; border-radius:6px; background:var(--panel2); overflow:hidden; margin-bottom:18px;}
.budget-bar .fill{height:100%; background:linear-gradient(90deg, var(--green), var(--gold)); transition:width .3s;}
.item-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px;
}
.item-row .lbl{display:flex; align-items:center; gap:10px; font-size:13.5px;}
.item-row .cost{color:var(--dim); font-size:12px;}
.qty-ctrl{display:flex; align-items:center; gap:8px;}
.qty-ctrl button{
  width:26px; height:26px; border-radius:7px; background:var(--panel3); color:var(--text); font-size:14px; font-weight:700;
}
.qty-ctrl button:hover{background:var(--gold); color:#1b1400;}
.qty-ctrl span{min-width:16px; text-align:center; font-family:'Cairo'; font-weight:700;}

/* voting / funnel */
.funnel-row{margin-bottom:10px;}
.funnel-row .flabel{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; color:var(--dim);}
.funnel-row .fbar{height:22px; border-radius:6px; background:var(--panel2); overflow:hidden;}
.funnel-row .fbar > div{height:100%; background:linear-gradient(90deg, var(--blue), var(--gold)); border-radius:6px; transition:width .5s;}
.funnel-row.killer .fbar > div{background:linear-gradient(90deg, var(--red), #ff8a5c);}
.drop-tag{font-size:11px; color:var(--red); font-weight:700;}
.vote-options{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:16px 0;}
.vote-opt{
  background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center;
  font-size:13px; font-weight:600; transition:.15s;
}
.vote-opt:hover{border-color:var(--gold);}
.vote-opt.correct{border-color:var(--green); background:rgba(63,167,150,.15); color:var(--green);}
.vote-opt.wrong-x{border-color:var(--red); background:rgba(228,87,46,.1); opacity:.6;}
.team-guess-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.team-guess-row select{
  background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; font-size:12.5px;
}
.result-tag{font-size:16px;}

/* classify cards */
.classify-card{
  background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:20px;
  text-align:center; margin-bottom:16px;
}
.classify-card .quote{font-size:16px; font-weight:600; margin-bottom:16px; line-height:1.7;}
.classify-btns{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.cbtn{padding:10px 6px; border-radius:9px; font-size:12.5px; font-weight:700; border:1.5px solid var(--border); background:var(--panel3); color:var(--text);}
.cbtn[data-k="hot"]{border-color:var(--red);} .cbtn[data-k="hot"].sel{background:var(--red); color:#2a0800;}
.cbtn[data-k="warm"]{border-color:var(--gold);} .cbtn[data-k="warm"].sel{background:var(--gold); color:#2a1a00;}
.cbtn[data-k="cold"]{border-color:var(--blue);} .cbtn[data-k="cold"].sel{background:var(--blue); color:#031522;}
.cbtn[data-k="dead"]{border-color:var(--dim);} .cbtn[data-k="dead"].sel{background:var(--dim); color:#151515;}
.tip-box{
  margin-top:14px; background:rgba(63,167,150,.1); border-right:3px solid var(--green);
  padding:10px 14px; border-radius:8px; font-size:12.5px; color:var(--text); text-align:right; display:none;
}
.tip-box.show{display:block;}
.deck-progress{display:flex; gap:5px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;}
.deck-progress span{width:7px; height:7px; border-radius:50%; background:var(--panel3);}
.deck-progress span.done{background:var(--gold);}

/* roleplay */
.rp-pair{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:14px;}
@media(max-width:640px){.rp-pair{grid-template-columns:1fr;}}
.rp-box{border-radius:10px; padding:16px; font-size:14px; font-weight:600; line-height:1.7; text-align:center;}
.rp-box.wrong{background:rgba(228,87,46,.1); border:1.5px solid var(--red); color:#ffb69c;}
.rp-box.right{background:rgba(63,167,150,.12); border:1.5px solid var(--green); color:#a9e8dc;}
.rp-arrow{font-size:20px; color:var(--dim);}
.rp-label{font-size:10.5px; font-weight:800; margin-bottom:6px; letter-spacing:.5px;}

/* ranking */
.rank-list{list-style:none; display:flex; flex-direction:column; gap:8px;}
.rank-item{
  display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px solid var(--border);
  border-radius:10px; padding:10px 14px; cursor:grab; font-size:13.5px;
}
.rank-item .num{
  width:24px; height:24px; border-radius:50%; background:var(--gold); color:#1b1400; font-family:'Cairo'; font-weight:800;
  font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.rank-item .mv{display:flex; gap:4px; margin-right:auto;}
.rank-item .mv button{width:24px; height:24px; border-radius:6px; background:var(--panel3); color:var(--text);}
.rank-item.dragging{opacity:.4;}

/* timeline colorer */
.tl-legend{display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
.tl-legend .lg{display:flex; align-items:center; gap:6px; font-size:12.5px;}
.tl-legend .sw{width:16px; height:16px; border-radius:4px;}
.tl-grid{display:flex; gap:4px; flex-wrap:wrap;}
.tl-slot{
  flex:1; min-width:70px; background:var(--panel2); border:1px solid var(--border); border-radius:8px;
  padding:12px 6px; text-align:center; font-size:11px; color:var(--dim);
}
.tl-slot .hr{font-weight:700; margin-bottom:6px; color:var(--text); font-size:11px;}
.tl-slot .sq{width:26px; height:26px; border-radius:6px; margin:0 auto; background:var(--panel3); font-size:14px; display:flex; align-items:center; justify-content:center;}

/* scheduler build-day */
.slot-list{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.slot-line{display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:8px 12px;}
.slot-line .time{width:70px; font-size:12px; color:var(--dim); flex-shrink:0;}
.slot-line select{flex:1; background:var(--panel3); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:6px 10px; font-size:12.5px;}
.critique-q{background:var(--panel2); border-right:3px solid var(--purple); border-radius:8px; padding:9px 14px; font-size:13px; margin-bottom:7px;}

/* commitment */
.commit-box{background:var(--panel2); border:2px dashed var(--border); border-radius:12px; padding:22px; text-align:center;}
.commit-box .lines{display:flex; flex-direction:column; gap:10px; margin:16px 0; max-width:420px; margin-inline:auto;}
.commit-box .lines div{border-bottom:1.5px solid var(--panel3); padding:8px 4px; font-size:13px; color:var(--dim);}
.timer{font-family:'Cairo'; font-size:38px; font-weight:800; color:var(--gold); text-align:center; margin:10px 0;}

/* message reveal */
.msg-toggle{
  display:inline-flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--gold);
  color:var(--gold); padding:9px 18px; border-radius:10px; font-weight:700; font-size:13px; margin-top:6px;
}
.msg-box{
  margin-top:12px; background:linear-gradient(135deg, rgba(232,169,61,.14), rgba(232,169,61,.04));
  border:1px solid var(--gold); border-radius:12px; padding:16px 18px; font-family:'Cairo'; font-weight:700;
  font-size:15.5px; line-height:1.9; display:none;
}
.msg-box.show{display:block; animation:pop .3s;}
@keyframes pop{from{transform:scale(.96); opacity:0}to{transform:scale(1); opacity:1}}

/* award footer */
.award-footer{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; margin-top:20px;
}
.award-footer .lbl{font-size:12.5px; color:var(--dim); font-weight:700;}
.award-team-btn{
  display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--border);
  padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--text);
}
.award-team-btn:hover{border-color:var(--gold); color:var(--gold);}
.award-team-btn .d{width:8px; height:8px; border-radius:50%;}

/* nav footer */
.nav-footer{display:flex; justify-content:space-between; margin-top:26px; gap:10px;}

/* flip overlay */
.flip-overlay{
  position:fixed; inset:0; background:rgba(10,12,16,.96); z-index:100; display:none;
  align-items:center; justify-content:center; flex-direction:column; padding:30px;
}
.flip-overlay.show{display:flex;}
.flip-overlay h2{font-size:15px; color:var(--dim); letter-spacing:2px; margin-bottom:26px; text-transform:uppercase;}
.flip-board{display:flex; gap:22px; flex-wrap:wrap; justify-content:center; max-width:1000px;}
.flip-card{
  background:var(--panel); border:2px solid var(--border); border-radius:18px; padding:24px 30px; text-align:center;
  min-width:150px; position:relative;
}
.flip-card.rank1{border-color:var(--gold); box-shadow:0 0 40px rgba(232,169,61,.35);}
.flip-card .crown{font-size:24px; position:absolute; top:-18px; left:50%; transform:translateX(-50%);}
.flip-card .fname{font-size:14px; color:var(--dim); margin-bottom:8px; font-weight:700;}
.flip-card .fscore{font-family:'Cairo'; font-size:52px; font-weight:900; color:var(--gold);}
.flip-close{margin-top:34px;}

/* edit teams modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,12,16,.88); z-index:110; display:none;
  align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px 24px;
  max-width:440px; width:100%; max-height:85vh; overflow-y:auto;
}
.modal-box h3{font-size:17px; margin-bottom:16px; text-align:center;}
.edit-team-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.edit-team-row input{
  flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--text);
  padding:10px 12px; border-radius:9px; font-size:13.5px; border-right:4px solid var(--tc, var(--gold));
}
.edit-team-row input:focus{outline:none; border-color:var(--gold);}
.edit-team-row .rm{
  width:32px; height:32px; border-radius:8px; background:var(--panel3); color:var(--red); font-size:15px; flex-shrink:0;
}
.edit-team-row .rm:hover{background:var(--red); color:#2a0800;}
.edit-add-btn{
  width:100%; padding:10px; border-radius:9px; background:var(--panel2); border:1px dashed var(--border);
  color:var(--dim); font-size:13px; margin-bottom:18px;
}
.edit-add-btn:hover{border-color:var(--gold); color:var(--gold);}
.modal-actions{display:flex; gap:10px; justify-content:center;}

/* closing */
.closing-quote{
  text-align:center; padding:60px 20px; font-family:'Cairo'; font-size:22px; font-weight:800; line-height:2;
  background:linear-gradient(135deg, rgba(232,169,61,.1), transparent); border-radius:16px; border:1px solid var(--border);
}
.closing-quote span{color:var(--gold);}

/* misc */
.badge-mini{font-size:10.5px; background:var(--panel3); padding:3px 8px; border-radius:6px; color:var(--dim);}
.hamburger{display:none;}
.sidebar-backdrop{display:none;}
.sidebar-close{display:none;}
.leader-badge{display:none;}

@media(max-width:880px){
  .topbar{padding:8px 12px; gap:8px;}
  .score-strip{display:none;}
  .leader-badge{
    display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--gold);
    border-radius:999px; padding:6px 12px; font-size:12.5px; flex:1; min-width:0;
  }
  .leader-badge b{font-family:'Cairo'; color:var(--gold); font-size:14px;}
  .leader-badge span.lbl{color:var(--dim); font-size:11px; flex-shrink:0;}
  .leader-badge span.nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brand .txt{display:none;}
  .hamburger{display:flex;}
  .iconbtn{width:40px; height:40px; font-size:16px;}

  .sidebar-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:38; display:none;
  }
  .sidebar-backdrop.show{display:block;}
  .sidebar{
    position:fixed; right:0; top:0; bottom:0; width:82vw; max-width:320px; z-index:39;
    transform:translateX(100%); transition:transform .25s; box-shadow:-10px 0 30px rgba(0,0,0,.5);
    padding-top:10px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-close{
    display:flex; align-items:center; justify-content:space-between; padding:6px 6px 14px;
    border-bottom:1px solid var(--border); margin-bottom:10px; font-family:'Cairo'; font-weight:800; font-size:14px;
  }
  .sidebar-close button{

function save(){ localStorage.setItem('pipelineWorkshop', JSON.stringify(state)); }
function load(){ try{ return JSON.parse(localStorage.getItem('pipelineWorkshop')); }catch(e){ return null; } }
function eph(key, def){ if(state.ephemeral[key]===undefined) state.ephemeral[key]=def; return state.ephemeral[key]; }
function setEph(key,val){ state.ephemeral[key]=val; }

const app = document.getElementById('app');
function render(){ save(); app.innerHTML = state.view==='setup' ? setupScreen() : mainScreen(); const bd=document.getElementById('sidebarBackdrop'); if(bd) bd.classList.remove('show'); attachHandlers(); }

    <h1>ورشة إدارة الـ Pipeline والوقت</h1>

}

/* ========================= SHELL ========================= */
function sortedTeams(){ return state.teams.map((t,i)=>({...t, idx:i})).sort((a,b)=>b.score-a.score); }
function scoreStrip(){
  const ranked = sortedTeams();
  const medals = ['🥇','🥈','🥉'];
  return ranked.map((t,pos)=>`
    <div class="chip ${pos===0 && t.score>0 ?'lead':''}">
      <span class="dot" style="background:${t.color}"></span>
      <b>${t.name}</b>
      ${pos<3 && t.score>0 ? `<span class="medal">${medals[pos]}</span>` : ''}
      <span class="pts">${t.score}</span>
      <button class="plus" data-quickpt="${t.idx}">+</button>
    </div>`).join('');
}
function sidebarNav(){
  const p1 = ACTIVITIES.filter(a=>a.part===1), p2 = ACTIVITIES.filter(a=>a.part===2);
  const item = (a)=>{
    const done = (state.ephemeral.visited||[]).includes(a.id);
    const active = state.activityIndex === ACTIVITIES.indexOf(a);
    return `<div class="navitem ${active?'active':''} ${done?'done':''}" data-goto="${ACTIVITIES.indexOf(a)}">
      <span class="n">${done?'':a.id}</span><span>${a.icon} ${a.title}</span></div>`;
  };
  return `<h4>الجزء الأول — Pipeline</h4>${p1.map(item).join('')}<h4>الجزء الثاني — إدارة الوقت</h4>${p2.map(item).join('')}`;
}
function leaderBadge(){
  const ranked = sortedTeams();

  return `<div class="leader-badge"><span class="lbl">🥇 المتصدر</span><b class="nm">${top.name}</b><span>${top.score}</span></div>`;
}

  let inner = '';
  switch(a.type){
    case 'budget': inner = renderBudget(a); break;
    case 'discussion': inner = renderDiscussion(a); break;
    case 'funnel': inner = renderFunnel(a); break;
    case 'conversion': inner = renderConversion(a); break;
    case 'case': inner = renderCase(a); break;
    case 'classify': inner = renderClassify(a); break;
    case 'roleplay': inner = renderRoleplay(a); break;
    case 'timeline': inner = renderTimeline(a); break;
    case 'rank': inner = renderRank(a); break;
    case 'buildday': inner = renderBuildDay(a); break;
    case 'commitment': inner = renderCommitment(a); break;
    default: inner = '';
  }
  const idx = ACTIVITIES.indexOf(a);
  return `
    <div class="part-tag">${a.part===1?'الجزء الأول 🔄 Pipeline':'الجزء الثاني ⏳ إدارة الوقت'} · نشاط ${a.id} من ${ACTIVITIES.length}</div>

      <h2>${a.title}</h2>
      <div class="tagline">${a.tag}</div>
    </div>

    <div class="instr" id="instrBox">🎤 <b>تعليمات الفاسيليتيتور:</b> ${a.instr}</div>

    <div class="card">
      <button class="msg-toggle" id="msgToggle">💡 اكشف "الرسالة"</button>
      <div class="msg-box" id="msgBox">${a.message}</div>
    </div>

    <div class="nav-footer">
      <button class="btn-ghost" data-nav="-1" ${idx===0?'disabled style="opacity:.3"':''}>→ السابق</button>

    </div>`;
}
function markVisited(id){ const v = eph('visited', []); if(!v.includes(id)){ v.push(id); } }

/* ---- funnel: who killed the pipeline ---- */
function renderFunnel(a){
  const revealed = eph('funnelRevealed', false);
  const maxV = FUNNEL[0].value;
  const rows = FUNNEL.map((f,i)=>{
    const drop = i>0 ? Math.round((1-(f.value/FUNNEL[i-1].value))*100) : 0;
    const isKiller = i===5;
    return `<div class="funnel-row ${revealed && isKiller?'killer':''}">
      <div class="flabel"><span>${f.label}</span><span>${f.value}${i>0?`<span class="drop-tag"> ↓ ${drop}%</span>`:''}</span></div>
      <div class="fbar"><div style="width:${(f.value/maxV)*100}%"></div></div>
    </div>`;
  }).join('');
  const guesses = eph('funnelGuesses', {});
  const teamGuessRows = state.teams.map((t,i)=>`
    <div class="team-guess-row">
      <span class="dot" style="background:${t.color};width:9px;height:9px;border-radius:50%;display:inline-block"></span>
      <b style="font-size:12.5px">${t.name}</b>
      <select data-guess="${i}">
        <option value="">اختار توقعهم...</option>
        ${KILL_OPTIONS.map(o=>`<option ${guesses[i]===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`).join('');
  return `
  <div class="card"><h3>📉 الفانل</h3>${rows}</div>
  <div class="card">
    <h3>🗳️ توقعات الفرق</h3>
    ${teamGuessRows}
    <button class="btn-primary" id="revealKiller" style="margin-top:12px;padding:10px 22px;font-size:13px;">اكشف الحقيقة</button>
    ${revealed ? `
      <div class="vote-options" style="margin-top:16px;">
        ${KILL_OPTIONS.map(o=>`<div class="vote-opt ${o==='Proposal → Closing'?'correct':'wrong-x'}">${o}${o==='Proposal → Closing'?' ✅':''}</div>`).join('')}
      </div>
      <p style="font-size:12.5px;color:var(--dim);margin-top:10px">القاتل الحقيقي: انهيار 89% بين Proposal و Closing — مش السعر ولا الجودة.</p>
    `:''}
  </div>`;
}

      ${ranked.map((t,pos)=>`
      <div class="flip-card ${pos===0 && t.score>0?'rank1':''}">
        ${pos===0 && t.score>0?'<div class="crown">👑</div>':''}
        <div class="fname">${t.name}</div>
        <div class="fscore">${t.score}</div>
      </div>`).join('')}

    <button class="btn-primary flip-close" id="flipCloseBtn">إغلاق</button>

/* ========================= EVENT HANDLERS ========================= */
function attachHandlers(){
  if(state.view==='setup'){
    document.getElementById('teamMinus').onclick=()=>{ if(state.setupCount>2){ state.setupCount--; eph('setupNames').length=state.setupCount; render(); } };
    document.getElementById('teamPlus').onclick=()=>{ if(state.setupCount<6){ state.setupCount++; const n=eph('setupNames'); n.push(''); render(); } };
    document.querySelectorAll('[data-team-name]').forEach(inp=>{
      inp.oninput=(e)=>{ eph('setupNames')[+e.target.dataset.teamName]=e.target.value; };
    });
    document.getElementById('startBtn').onclick=()=>{
      const names = eph('setupNames');
      state.teams = Array.from({length:state.setupCount}, (_,i)=>({
        name: (names[i] && names[i].trim()) || `فريق ${i+1}`,
        score:0, color:TEAM_COLORS[i]
      }));
      state.view='main'; state.activityIndex=0; state.ephemeral={visited:[]};
      render();
    };
    return;
  }

  // header
  const ham=document.getElementById('hamBtn');
  const sidebarEl=document.getElementById('sidebar');
  const backdrop=document.getElementById('sidebarBackdrop');
  const openSidebar=()=>{ sidebarEl.classList.add('open'); if(backdrop) backdrop.classList.add('show'); };
  const closeSidebar=()=>{ sidebarEl.classList.remove('open'); if(backdrop) backdrop.classList.remove('show'); };
  if(ham) ham.onclick=()=>{ sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar(); };
  const sidebarCloseBtn=document.getElementById('sidebarCloseBtn'); if(sidebarCloseBtn) sidebarCloseBtn.onclick=closeSidebar;
  if(backdrop) backdrop.onclick=closeSidebar;
  document.getElementById('flipBtn').onclick=()=>document.getElementById('flipOverlay').classList.add('show');
  document.getElementById('flipCloseBtn').onclick=()=>document.getElementById('flipOverlay').classList.remove('show');
  document.getElementById('resetBtn').onclick=()=>{ if(confirm('هل تريد إعادة ضبط الورشة بالكامل؟')){ localStorage.removeItem('pipelineWorkshop'); state={teams:[],view:'setup',activityIndex:0,setupCount:3,ephemeral:{}}; render(); } };

  // edit teams modal
  document.getElementById('editTeamsBtn').onclick=()=>{ setEph('editBackup', JSON.parse(JSON.stringify(state.teams))); setEph('editModalOpen', true); render(); };
  const editCancel=document.getElementById('editCancel');
  if(editCancel) editCancel.onclick=()=>{ state.teams = eph('editBackup'); setEph('editModalOpen', false); render(); };
  const editSave=document.getElementById('editSave');
  if(editSave) editSave.onclick=()=>{
    state.teams.forEach(t=>{ if(!t.name || !t.name.trim()) t.name='فريق'; });
    setEph('editModalOpen', false); render();
  };
  document.querySelectorAll('[data-edit-name]').forEach(inp=>inp.oninput=(e)=>{ state.teams[+e.currentTarget.dataset.editName].name = e.currentTarget.value; save(); });
  document.querySelectorAll('[data-edit-remove]').forEach(b=>b.onclick=(e)=>{
    if(state.teams.length<=2) return;
    if(!confirm('هل تريد حذف هذا الفريق ونقاطه؟')) return;
    state.teams.splice(+e.currentTarget.dataset.editRemove,1); render();
  });
  const addTeamBtn=document.getElementById('addTeamBtn');
  if(addTeamBtn) addTeamBtn.onclick=()=>{
    if(state.teams.length>=6) return;
    const usedColors = state.teams.map(t=>t.color);
    const nextColor = TEAM_COLORS.find(c=>!usedColors.includes(c)) || TEAM_COLORS[state.teams.length%TEAM_COLORS.length];
    state.teams.push({name:`فريق ${state.teams.length+1}`, score:0, color:nextColor});
    render();
  };

  document.querySelectorAll('[data-quickpt]').forEach(b=>b.onclick=(e)=>awardPoint(+e.target.dataset.quickpt, e.target));
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=(e)=>{ state.activityIndex=+e.currentTarget.dataset.goto; state.ephemeral={visited:state.ephemeral.visited||[]}; render(); });
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=(e)=>{
    const d=+e.currentTarget.dataset.nav;
    if(state.activityIndex+d>=ACTIVITIES.length){ document.getElementById('flipOverlay').classList.add('show'); return; }
    if(state.activityIndex+d<0) return;
    state.activityIndex+=d; state.ephemeral={visited:state.ephemeral.visited||[]}; render();
  });
  document.querySelectorAll('[data-award]').forEach(b=>b.onclick=(e)=>awardPoint(+e.currentTarget.dataset.award, e.currentTarget));

  const msgToggle=document.getElementById('msgToggle');
  if(msgToggle) msgToggle.onclick=()=>document.getElementById('msgBox').classList.toggle('show');
  const instrToggle=document.getElementById('instrToggle');
  if(instrToggle) instrToggle.onclick=(e)=>{
    const box=document.getElementById('instrBox'); box.classList.toggle('show');
    e.currentTarget.textContent = box.classList.contains('show') ? '🎤 إخفاء تعليمات المدرب' : '🎤 اعرض تعليمات المدرب';
  };

  // budget
  document.querySelectorAll('[data-budg-plus]').forEach(b=>b.onclick=(e)=>{
    const id=e.currentTarget.dataset.budgPlus, key=e.currentTarget.dataset.budgkey, cost=+e.currentTarget.dataset.cost;
    const a=ACTIVITIES[state.activityIndex]; const q=eph(key);
    const spent=a.items.reduce((s,it)=>s+it.cost*q[it.id],0);
    if(spent+cost<=a.total){ q[id]++; render(); }
  });
  document.querySelectorAll('[data-budg-minus]').forEach(b=>b.onclick=(e)=>{
    const key='budget_'+ACTIVITIES[state.activityIndex].id;
    const q=eph(key); const id=e.currentTarget.dataset.budgMinus;
    if(q[id]>0){ q[id]--; render(); }
  });
  const revealBudget=document.getElementById('revealBudget');
  if(revealBudget) revealBudget.onclick=()=>{
    const a=ACTIVITIES[state.activityIndex]; const key='budget_'+a.id; const q=eph(key);
    const nonProspect = a.items.filter(it=>it.id!=='prospecting').reduce((s,it)=>s+it.cost*q[it.id],0);
    const prospectSpend = q['prospecting']||0;
    document.getElementById('budgetResult').innerHTML = `<div class="tip-box show" style="margin-top:12px;">
      صرفت <b>${prospectSpend*35}${a.unit}</b> على ما يجيب عملاء جدد (Prospecting) مقابل <b>${nonProspect}${a.unit}</b> على باقي الأنشطة. وازن الصورة قدام الفريق.</div>`;
  };

  // funnel
  const revealKiller=document.getElementById('revealKiller');
  if(revealKiller) revealKiller.onclick=()=>{ setEph('funnelRevealed',true); render(); };
  document.querySelectorAll('[data-guess]').forEach(s=>s.onchange=(e)=>{
    const g=eph('funnelGuesses'); g[e.currentTarget.dataset.guess]=e.currentTarget.value;
  });

  // conversion
  const cl=document.getElementById('convLeadsSlider'); if(cl) cl.oninput=(e)=>{ setEph('convLeads',+e.target.value); render(); };
  const cr=document.getElementById('convRateSlider'); if(cr) cr.oninput=(e)=>{ setEph('convRate',+e.target.value); render(); };
  const cp=document.getElementById('convPreset'); if(cp) cp.onclick=()=>{ setEph('convRate',10); render(); setTimeout(()=>{ setEph('convRate',20); render(); },900); };

  // case
  const caseReveal=document.getElementById('caseReveal'); if(caseReveal) caseReveal.onclick=()=>{ setEph('caseRevealed',true); render(); };

  // classify
  document.querySelectorAll('[data-classify]').forEach(b=>b.onclick=(e)=>{ const ans=eph('classifyAns'); ans[eph('classifyIdx')]=e.currentTarget.dataset.classify; render(); });
  const cPrev=document.getElementById('classifyPrev'); if(cPrev) cPrev.onclick=()=>{ setEph('classifyIdx', Math.max(0,eph('classifyIdx')-1)); render(); };
  const cNext=document.getElementById('classifyNext'); if(cNext) cNext.onclick=()=>{ setEph('classifyIdx', Math.min(CLASSIFY_CARDS.length-1,eph('classifyIdx')+1)); render(); };

  // timeline
  document.querySelectorAll('[data-tlhour]').forEach(sq=>sq.onclick=(e)=>{
    const colors=eph('tlColors'); const h=e.currentTarget.dataset.tlhour;
    const keys=TL_COLORS.map(c=>c.k); const cur=colors[h]; const curIdx=keys.indexOf(cur);
    colors[h]= curIdx===-1 ? keys[0] : (curIdx===keys.length-1 ? null : keys[curIdx+1]);
    render();
  });

  // rank
  document.querySelectorAll('[data-rankmove]').forEach(b=>b.onclick=(e)=>{
    const key=e.currentTarget.dataset.rankkey, i=+e.currentTarget.dataset.i, dir=e.currentTarget.dataset.rankmove;
    const arr=eph(key); const j = dir==='up'? i-1 : i+1;
    if(j<0||j>=arr.length) return;
    [arr[i],arr[j]]=[arr[j],arr[i]]; render();
  });

  // build day
  document.querySelectorAll('[data-buildslot]').forEach(sel=>sel.onchange=(e)=>{ eph('buildday')[e.currentTarget.dataset.buildslot]=e.currentTarget.value; });
  const critiqueBtn=document.getElementById('critiqueBtn'); if(critiqueBtn) critiqueBtn.onclick=()=>{ setEph('buildRevealed',true); render(); };

  // commitment timer
  const commitStart=document.getElementById('commitStart');
  if(commitStart) commitStart.onclick=()=>{
    if(eph('commitRunning')) { setEph('commitRunning',false); clearInterval(window.__commitInterval); render(); return; }
    setEph('commitRunning',true); render();
    window.__commitInterval=setInterval(()=>{
      let s=eph('commitTimer'); s = s>0? s-1 : 0;
      setEph('commitTimer', s);
      const clock=document.getElementById('commitClock');
      if(clock) clock.textContent=fmtTime(s);
      if(s===0){ clearInterval(window.__commitInterval); setEph('commitRunning',false); }
    },1000);
  };
}

function awardPoint(teamIdx, btnEl){
  state.teams[teamIdx].score++;
  const fp=document.createElement('span'); fp.className='floatpt'; fp.textContent='+1';
  const chip = btnEl.closest('.chip') || btnEl;
  chip.style.position='relative'; chip.appendChild(fp);
  chip.style.transform='scale(1.08)'; setTimeout(()=>{chip.style.transform='';},250);
  setTimeout(()=>render(), 550);
  save();
}

render();
</script>
</body>
